name: Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install test dependencies
        run: |
          uv sync --extra dev
          uv pip install "jsonschema>=4.23,<5"

      - name: Player selection tests
        run: uv run pytest tests/test_player_selection.py

      - name: P1 and Analytics integration tests
        run: uv run pytest tests/test_p1_analytics_integration.py

      - name: Analytics tests
        run: uv run --with "jsonschema>=4.23,<5" pytest tests/test_analytics_*.py

      - name: Validate P1 Analytics functional wiring
        run: uv run python scripts/check_p1_analytics_functional_wiring.py

      - name: Stage 0B deterministic Analysis Bundle fixture
        run: |
          uv run python scripts/build_stage0b_fixture.py
          uv run tennisai bundle validate --bundle .artifacts/stage0b-analysis-bundle-fixture/bundle --json
          test "$(jq -r '.fingerprints_identical' .artifacts/stage0b-analysis-bundle-fixture/build-report.json)" = "true"
          uv run pytest tests/test_analysis_bundle_*.py tests/test_product_*.py

      - name: Stage 1A deterministic single-rally import fixture
        run: |
          uv run python scripts/build_stage1a_fixture.py
          uv run tennisai rally validate --bundle .artifacts/stage1a-single-rally-import/bundle --json
          test "$(jq -r '.fingerprints_identical' .artifacts/stage1a-single-rally-import/import-report.json)" = "true"
          uv run pytest tests/test_single_rally.py

      - name: Stage 1B real single-rally candidate fixture
        run: |
          uv run tennisai rally validate --bundle tests/fixtures/product/real_single_rally_nivel_a2_01 --json
          uv run pytest tests/test_real_single_rally.py --junitxml=.artifacts/stage1b-real-single-rally-test-report.xml

      - name: Ruff
        run: uv run ruff check .

      - name: Compile Python sources
        run: uv run python -m compileall src scripts tests infrastructure

      - name: Replit smoke test
        run: uv run python scripts/replit_smoke_test.py

      - name: Validate serialized Analytics schemas
        run: uv run --with "jsonschema>=4.23,<5" python -m src.analytics.schema_validation

      - name: Publish Stage 0B Analysis Bundle fixture
        uses: actions/upload-artifact@v4
        with:
          name: stage0b-analysis-bundle-fixture
          path: |
            .artifacts/stage0b-analysis-bundle-fixture/manifest.json
            .artifacts/stage0b-analysis-bundle-fixture/session.json
            .artifacts/stage0b-analysis-bundle-fixture/rallies.json
            .artifacts/stage0b-analysis-bundle-fixture/build-report.json
            .artifacts/stage0b-analysis-bundle-fixture/validation-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true

      - name: Publish Stage 1A single-rally import fixture
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-single-rally-import
          path: |
            .artifacts/stage1a-single-rally-import/manifest.json
            .artifacts/stage1a-single-rally-import/session.json
            .artifacts/stage1a-single-rally-import/rallies.json
            .artifacts/stage1a-single-rally-import/events.jsonl
            .artifacts/stage1a-single-rally-import/ball_track.jsonl
            .artifacts/stage1a-single-rally-import/court_map.json
            .artifacts/stage1a-single-rally-import/metrics.json
            .artifacts/stage1a-single-rally-import/import-report.json
            .artifacts/stage1a-single-rally-import/validation-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish Stage 1B real single-rally candidate
        uses: actions/upload-artifact@v4
        with:
          name: stage1b-real-single-rally-candidate
          path: |
            tests/fixtures/product/real_single_rally_nivel_a2_01/manifest.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/session.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/rallies.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/events.jsonl
            tests/fixtures/product/real_single_rally_nivel_a2_01/ball_track.jsonl
            tests/fixtures/product/real_single_rally_nivel_a2_01/court_map.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/metrics.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/REFERENCE_SOURCE.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/alignment-report.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/video-metadata.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/timestamp-audit.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/track-audit.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/event-track-alignment.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/calibration-audit.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/asset-hashes.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/validation-report.json
            tests/fixtures/product/real_single_rally_nivel_a2_01/track-court-preview.svg
            tests/fixtures/product/real_single_rally_nivel_a2_01/event-timeline.svg
            .artifacts/stage1b-real-single-rally-test-report.xml
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish P1 GPU retest visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: p1-gpu-retest-visual-evidence
          path: |
            docs/validation/assets/p1_gpu_retest_contact_sheet.jpg
            docs/validation/assets/p1_gpu_retest_before_after.jpg
            docs/validation/P1_GPU_RETEST_VISUAL_AUDIT.md
            config/player_perception/p1_gpu_retest_result.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  session-platform:
    name: Core Stage 2A Session Platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install platform and test dependencies
        run: uv sync --extra platform --extra dev

      - name: Unit and contract tests
        run: |
          mkdir -p .artifacts/stage2a-session-platform
          uv run --extra platform pytest tests/test_session_platform.py \
            --junitxml=.artifacts/stage2a-session-platform/unit-test-report.xml
          SOURCE_COMMIT="$(jq -r '.source_commit' config/platform/SESSION_API_SOURCE.json)"
          uv run --extra platform python scripts/export_session_api_openapi.py \
            --source-commit "$SOURCE_COMMIT"
          uv run --extra platform python scripts/export_session_api_postman.py
          uv run --extra platform python scripts/validate_session_api_contract.py
          git diff --exit-code -- config/platform/session_api_v1.openapi.json config/platform/SESSION_API_SOURCE.json docs/postman/TennisAI-Session-API.postman_collection.json
          uv run ruff check src/platform tests/test_session_platform.py scripts/export_session_api_openapi.py scripts/export_session_api_postman.py scripts/validate_session_api_contract.py

      - name: Stage 2B orchestration unit and OpenAPI contract
        run: |
          mkdir -p .artifacts/stage2b-analysis-jobs
          uv run --extra platform pytest tests/test_analysis_jobs.py tests/test_analysis_job_api.py \
            --junitxml=.artifacts/stage2b-analysis-jobs/unit-test-report.xml
          uv run --extra platform python scripts/export_analysis_job_api_openapi.py
          uv run --extra platform python scripts/validate_analysis_job_contract.py \
            > .artifacts/stage2b-analysis-jobs/openapi-validation.json
          uv run ruff check src/platform tests/test_analysis_jobs.py tests/test_analysis_job_api.py \
            tests/test_analysis_jobs_integration.py scripts/export_analysis_job_api_openapi.py \
            scripts/validate_analysis_job_contract.py scripts/audit_analysis_job_runtime.py \
            scripts/export_analysis_job_runtime_evidence.py

      - name: Start PostgreSQL, MinIO and API container
        env:
          POSTGRES_PASSWORD: tennisai
          S3_SECRET_KEY: minioadmin
        run: |
          docker compose -f infrastructure/session-platform/compose.yml up -d postgres minio minio-init
          docker compose -f infrastructure/session-platform/compose.yml wait minio-init || {
            docker compose -f infrastructure/session-platform/compose.yml logs --no-color minio-init
            exit 1
          }
          docker compose -f infrastructure/session-platform/compose.yml logs --no-color minio-init
          docker compose -f infrastructure/session-platform/compose.yml up -d --build api analysis-api
          docker compose -f infrastructure/session-platform/compose.yml logs --no-color api analysis-api || true
          api_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/healthz >/dev/null; then api_ready=true; break; fi
            sleep 2
          done
          docker compose -f infrastructure/session-platform/compose.yml logs --no-color api analysis-api || true
          test "$api_ready" = true
          curl --fail --silent http://localhost:8000/healthz >/dev/null
          analysis_api_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8001/api/v1/analysis/openapi.json >/dev/null; then analysis_api_ready=true; break; fi
            sleep 2
          done
          docker compose -f infrastructure/session-platform/compose.yml logs --no-color api analysis-api || true
          test "$analysis_api_ready" = true
          curl --fail --silent http://localhost:8001/api/v1/analysis/openapi.json >/dev/null
          docker compose -f infrastructure/session-platform/compose.yml ps
          docker compose -f infrastructure/session-platform/compose.yml images --format json api \
            > .artifacts/stage2a-session-platform/docker-images.json
          uv run python -c 'import json; from pathlib import Path; p=Path(".artifacts/stage2a-session-platform/docker-images.json"); raw=p.read_text().strip(); rows=json.loads(raw) if raw.startswith("[") else [json.loads(line) for line in raw.splitlines() if line.strip()]; Path(".artifacts/stage2a-session-platform/docker-build-report.json").write_text(json.dumps({"status":"built","images":rows}, sort_keys=True)+"\n")'

      - name: Apply migrations and run storage integration
        env:
          TENNISAI_DATABASE_URL: postgresql+psycopg://tennisai:tennisai@localhost:5432/tennisai
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          TENNISAI_S3_INTERNAL_ENDPOINT_URL: http://localhost:9000
          TENNISAI_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
          TENNISAI_S3_ACCESS_KEY: minioadmin
          TENNISAI_S3_SECRET_KEY: minioadmin
          TENNISAI_S3_BUCKET: tennisai-local
          RUN_SESSION_PLATFORM_HTTP_INTEGRATION: "1"
          SESSION_PLATFORM_API_BASE_URL: http://localhost:8000
          SESSION_PLATFORM_RUNTIME_RESULTS_PATH: .artifacts/stage2a-session-platform/runtime-results.json
        run: |
          uv run --extra platform tennisai platform migrate
          uv run --extra platform alembic downgrade 0001_session_platform
          uv run --extra platform alembic upgrade head
          uv run --extra platform alembic current > .artifacts/stage2a-session-platform/alembic-current.txt
          uv run python -c 'import json; from pathlib import Path; p=Path(".artifacts/stage2a-session-platform/alembic-current.txt"); Path(".artifacts/stage2a-session-platform/migration-report.json").write_text(json.dumps({"status":"migrations_reapplied","service":"postgresql","alembic_current":p.read_text().strip(),"revision":"0002_analysis_job_orchestration"}, sort_keys=True)+"\n")'
          uv run --extra platform tennisai platform doctor \
            > .artifacts/stage2a-session-platform/doctor-report.json
          uv run --extra platform pytest tests/test_session_platform_integration.py \
            --junitxml=.artifacts/stage2a-session-platform/integration-test-report.xml
          RUN_ANALYSIS_JOB_HTTP_INTEGRATION=1 ANALYSIS_JOB_API_BASE_URL=http://localhost:8001 \
            uv run --extra platform pytest tests/test_analysis_jobs_integration.py \
            --junitxml=.artifacts/stage2b-analysis-jobs/integration-test-report.xml
          uv run python scripts/export_analysis_job_runtime_evidence.py \
            --unit .artifacts/stage2b-analysis-jobs/unit-test-report.xml \
            --integration .artifacts/stage2b-analysis-jobs/integration-test-report.xml \
            --openapi .artifacts/stage2b-analysis-jobs/openapi-validation.json \
            --session-openapi config/platform/session_api_v1.openapi.json \
            --base-sha b3703003fe2aa23f8703097b0dc155c7825f5363 \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --migration-revision 0002_analysis_job_orchestration \
            --migration-report .artifacts/stage2a-session-platform/migration-report.json \
            --output .artifacts/stage2b-analysis-jobs/analysis-job-runtime.json
          uv run python scripts/audit_analysis_job_runtime.py .artifacts/stage2b-analysis-jobs/analysis-job-runtime.json \
            > .artifacts/stage2b-analysis-jobs/security-summary.json
          curl --fail --silent http://localhost:8000/api/v1/openapi.json >/dev/null
          docker compose -f infrastructure/session-platform/compose.yml run --rm --no-deps \
            --entrypoint /bin/sh minio-init -c \
            'mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && if cors_output=$(mc cors get "local/$S3_BUCKET"); then if printf "%s" "$cors_output" | grep -q "CORSConfiguration"; then echo cors_mode=bucket_policy; printf "%s\n" "$cors_output"; else echo cors_mode=global_api_local_development; mc admin config get local api; fi; else echo cors_mode=global_api_local_development; mc admin config get local api; fi && mc anonymous get "local/$S3_BUCKET"' \
            > .artifacts/stage2a-session-platform/cors-policy-output.txt
          uv run --extra platform python scripts/export_session_platform_runtime_evidence.py \
            --integration-xml .artifacts/stage2a-session-platform/integration-test-report.xml \
            --runtime-results .artifacts/stage2a-session-platform/runtime-results.json \
            --doctor .artifacts/stage2a-session-platform/doctor-report.json \
            --cors-policy-output .artifacts/stage2a-session-platform/cors-policy-output.txt \
            --output-dir .artifacts/stage2a-session-platform

      - name: Stop local services
        if: always()
        run: docker compose -f infrastructure/session-platform/compose.yml down -v

      - name: Publish Stage 2A session platform evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage2a-session-platform-evidence
          path: |
            config/platform/session_api_v1.openapi.json
            config/platform/SESSION_API_SOURCE.json
            docs/postman/TennisAI-Session-API.postman_collection.json
            docs/postman/TennisAI-Local.postman_environment.json
            docs/postman/README.md
            .artifacts/stage2a-session-platform/unit-test-report.xml
            .artifacts/stage2a-session-platform/integration-test-report.xml
            .artifacts/stage2a-session-platform/migration-report.json
            .artifacts/stage2a-session-platform/doctor-report.json
            .artifacts/stage2a-session-platform/cors-report.json
            .artifacts/stage2a-session-platform/presigned-endpoint-report.json
            .artifacts/stage2a-session-platform/docker-build-report.json
            .artifacts/stage2a-session-platform/security-summary.json
            .artifacts/stage2a-session-platform/runtime-test-summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish Stage 2B analysis orchestration evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage2b-analysis-orchestration-evidence
          path: |
            config/platform/analysis_job_api_v1.openapi.json
            .artifacts/stage2b-analysis-jobs/unit-test-report.xml
            .artifacts/stage2b-analysis-jobs/integration-test-report.xml
            .artifacts/stage2b-analysis-jobs/openapi-validation.json
            .artifacts/stage2b-analysis-jobs/analysis-job-runtime.json
            .artifacts/stage2b-analysis-jobs/security-summary.json
            .artifacts/stage2a-session-platform/migration-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
