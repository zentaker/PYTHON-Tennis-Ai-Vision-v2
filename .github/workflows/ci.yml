name: Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install test dependencies
        run: |
          uv sync --extra dev
          uv pip install "jsonschema>=4.23,<5"

      - name: Player selection tests
        run: uv run pytest tests/test_player_selection.py

      - name: P1 and Analytics integration tests
        run: uv run pytest tests/test_p1_analytics_integration.py

      - name: Analytics tests
        run: uv run --with "jsonschema>=4.23,<5" pytest tests/test_analytics_*.py

      - name: Validate P1 Analytics functional wiring
        run: uv run python scripts/check_p1_analytics_functional_wiring.py

      - name: Stage 5B v3 tests
        run: uv run --with "jsonschema>=4.23,<5" pytest tests/test_stage5b_v3_*.py

      - name: Validate Stage 5B v3 player-aware candidate
        run: uv run --with "jsonschema>=4.23,<5" python scripts/check_stage5b_v3_player_aware.py

      - name: Stage 5B v3.1 tests
        run: uv run --with "jsonschema>=4.23,<5" pytest tests/test_stage5b_v31_*.py

      - name: Validate Stage 5B v3.1 correction
        run: |
          uv run python scripts/check_stage5b_v31_coordinates.py
          uv run --with "jsonschema>=4.23,<5" python scripts/check_stage5b_v31_player_aware.py

      - name: Stage 5A.2 extended ground-plane tests
        run: uv run pytest tests/test_ground_plane_calibration_*.py

      - name: Validate Stage 5A.2 evidence
        run: uv run python scripts/check_stage5a2_extended_ground_plane.py

      - name: Stage 5A.2B temporal ground tests
        run: uv run pytest tests/test_stage5a2b_*.py

      - name: Validate Stage 5A.2B temporal evidence
        run: uv run python scripts/check_stage5a2b_temporal_ground.py

      - name: Stage 5A.2C contact ground tests
        run: uv run pytest tests/test_stage5a2c_*.py

      - name: Validate Stage 5A.2C contact anchors
        run: uv run python scripts/check_stage5a2c_contact_ground.py

      - name: Stage 5B v3.2 accepted-anchor tests
        run: uv run --with "jsonschema>=4.23,<5" pytest tests/test_stage5b_v32_*.py

      - name: Validate Stage 5B v3.2 accepted-anchor evidence
        run: uv run python scripts/check_stage5b_v32_accepted_anchors.py

      - name: Stage 5B v3.3 event-constrained tests
        run: uv run --with "jsonschema>=4.23,<5" pytest tests/test_stage5b_v33_*.py

      - name: Validate Stage 5B v3.3 forensic evidence
        run: uv run python scripts/check_stage5b_v33_event_constrained.py

      - name: Stage 5B v3.4 contact-ray tests
        run: uv run pytest tests/test_stage5b_v34_*.py

      - name: Validate Stage 5B v3.4 contact-ray evidence
        run: uv run python scripts/check_stage5b_v34_contact_ray.py

      - name: Stage 5B v3.5 measurement and observation-conditioned tests
        run: |
          uv run python scripts/run_stage5b_v35_observation_conditioned.py \
            --ball-track tests/fixtures/stage5b_v3/smoothed_trajectory_real.csv \
            --stage4-events data/clips/nivel_a2_01/manual_annotation.json \
            --p1-poses tests/fixtures/integration/p1_analytics_accepted/selected_player_pose.jsonl \
            --p1-contact-audit tests/fixtures/integration/p1_analytics_accepted/selected_contact_audit.json \
            --camera tests/fixtures/stage5b_v3/camera_model_refined.json \
            --anchors-v4 config/ground_plane_calibration/player_contact_ground_anchors_v4.jsonl \
            --output-dir .artifacts/stage5b-v35-observation-conditioned/output \
            --seed 42 --strict
          uv run pytest tests/test_stage5b_v35_*.py

      - name: Validate Stage 5B v3.5 observation-conditioned evidence
        run: uv run python scripts/check_stage5b_v35_observation_conditioned.py

      - name: Stage 5B v3.5.1 truthful Gate D and Gate A tests
        run: |
          uv run python scripts/run_stage5b_v351_truthful_gate_a.py \
            --ball-track tests/fixtures/stage5b_v3/smoothed_trajectory_real.csv \
            --stage4-events data/clips/nivel_a2_01/manual_annotation.json \
            --p1-poses tests/fixtures/integration/p1_analytics_accepted/selected_player_pose.jsonl \
            --p1-contact-audit tests/fixtures/integration/p1_analytics_accepted/selected_contact_audit.json \
            --camera tests/fixtures/stage5b_v3/camera_model_refined.json \
            --anchors-v4 config/ground_plane_calibration/player_contact_ground_anchors_v4.jsonl \
            --output-dir .artifacts/stage5b-v351-truthful-gate-a/output \
            --seed 42 --strict
          uv run pytest tests/test_stage5b_v351_truthful_gate_a.py

      - name: Validate Stage 5B v3.5.1 truthful evidence
        run: uv run python scripts/check_stage5b_v351_truthful_gate_a.py

      - name: Ruff
        run: uv run ruff check .

      - name: Compile Python sources
        run: uv run python -m compileall src scripts tests infrastructure

      - name: Replit smoke test
        run: uv run python scripts/replit_smoke_test.py

      - name: Validate serialized Analytics schemas
        run: uv run --with "jsonschema>=4.23,<5" python -m src.analytics.schema_validation

      - name: Publish P1 GPU retest visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: p1-gpu-retest-visual-evidence
          path: |
            docs/validation/assets/p1_gpu_retest_contact_sheet.jpg
            docs/validation/assets/p1_gpu_retest_before_after.jpg
            docs/validation/P1_GPU_RETEST_VISUAL_AUDIT.md
            config/player_perception/p1_gpu_retest_result.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish Stage 5B v3 player-aware evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5b-v3-player-aware-evidence
          path: |
            docs/validation/assets/stage5b_v3_reprojection_overlay.jpg
            docs/validation/assets/stage5b_v3_top_view.jpg
            docs/validation/assets/stage5b_v3_side_view.jpg
            docs/validation/assets/stage5b_v3_contact_audit.jpg
            docs/validation/assets/stage5b_v3_hypothesis_comparison.jpg
            docs/validation/STAGE5B_V3_PLAYER_AWARE_VISUAL_AUDIT.md
            config/stage5b_v3/stage5b_v3_result.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish Stage 5B v3.1 player-aware evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5b-v31-player-aware-evidence
          path: |
            docs/validation/assets/stage5b_v31_top_view.jpg
            docs/validation/assets/stage5b_v31_side_view.jpg
            docs/validation/assets/stage5b_v31_reprojection_contact_sheet.jpg
            docs/validation/assets/stage5b_v31_contact_audit.jpg
            docs/validation/assets/stage5b_v31_hypothesis_comparison.jpg
            docs/validation/assets/stage5b_v31_coordinate_audit.jpg
            docs/validation/STAGE5B_V31_VISUAL_AUDIT.md
            config/stage5b_v3/stage5b_v31_result.json
            config/stage5b_v3/coordinate_audit_result.json
            config/stage5b_v3/stage5b_v31_optimizer_report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish Stage 5A.2 extended ground-plane evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5a2-extended-ground-plane-evidence
          path: |
            docs/validation/assets/stage5a2_court_line_overlay.jpg
            docs/validation/assets/stage5a2_old_vs_refined_homography.jpg
            docs/validation/assets/stage5a2_camera_homography_consistency.jpg
            docs/validation/assets/stage5a2_player_foot_contact_sheet.jpg
            docs/validation/assets/stage5a2_player_ground_top_view.jpg
            docs/validation/assets/stage5a2_extrapolation_uncertainty.jpg
            docs/validation/STAGE5A2_EXTENDED_GROUND_PLANE_VISUAL_AUDIT.md
