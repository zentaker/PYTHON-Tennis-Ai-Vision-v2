            config/ground_plane_calibration/stage5a2c_line_fit_report.json
            config/ground_plane_calibration/stage5a2c_tracking_failures.json
            config/ground_plane_calibration/stage5a2c_contact_anchor_report.json
            config/ground_plane_calibration/stage5a2c_uncertainty.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish Stage 5B v3.2 accepted-anchor evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5b-v32-accepted-anchors-evidence
          path: |
            docs/validation/assets/stage5b_v32_reprojection_contact_sheet.jpg
            docs/validation/assets/stage5b_v32_top_view.jpg
            docs/validation/assets/stage5b_v32_side_view.jpg
