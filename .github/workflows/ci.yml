      - name: Publish Stage 5B v3.4 contact-ray evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5b-v34-contact-ray-evidence
          path: |
            docs/validation/assets/stage5b_v34_contact_pixel_reconciliation.jpg
