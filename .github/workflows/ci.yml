          retention-days: 30
          compression-level: 6

      - name: Publish Stage 5A.2B temporal ground evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5a2b-temporal-ground-evidence
          path: |
            docs/validation/assets/stage5a2b_line_segment_classification.jpg
            docs/validation/assets/stage5a2b_calibration_ensemble.jpg
            docs/validation/assets/stage5a2b_real_frame_foot_audit.jpg
            docs/validation/assets/stage5a2b_temporal_foot_tracks.jpg
            docs/validation/assets/stage5a2b_player_ground_top_view.jpg
            docs/validation/assets/stage5a2b_uncertainty_decomposition.jpg
            docs/validation/assets/stage5a2b_far_player_evidence.jpg
            docs/validation/STAGE5A2B_TEMPORAL_GROUND_VISUAL_AUDIT.md
            config/ground_plane_calibration/stage5a2b_result.json
            config/ground_plane_calibration/stage5a2b_line_support_report.json
            config/ground_plane_calibration/stage5a2b_calibration_cross_validation.json
            config/ground_plane_calibration/stage5a2b_player_validation_report.json
            config/ground_plane_calibration/stage5a2b_uncertainty.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish Stage 5A.2C contact ground evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5a2c-contact-ground-evidence
          path: |
            docs/validation/assets/stage5a2c_line_fit_families.jpg
