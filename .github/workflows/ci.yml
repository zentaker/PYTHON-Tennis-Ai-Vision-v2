            config/stage5b_v3/stage5b_v32_anchor_v4_report.json
            config/stage5b_v3/stage5b_v32_reprojection_report.json
            config/stage5b_v3/stage5b_v32_contact_residuals.json
            config/stage5b_v3/stage5b_v32_bounce_residuals.json
            config/stage5b_v3/stage5b_v32_uncertainty.json
          if-no-files-found: error
          retention-days: 30
