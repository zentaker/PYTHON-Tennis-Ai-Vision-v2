name: Project CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install test dependencies
        run: |
          uv sync --extra dev
          uv pip install "jsonschema>=4.23,<5"

      - name: Player selection tests
        run: uv run pytest tests/test_player_selection.py

      - name: P1 and Analytics integration tests
        run: uv run pytest tests/test_p1_analytics_integration.py

      - name: Analytics tests
        run: uv run --with "jsonschema>=4.23,<5" pytest tests/test_analytics_*.py

      - name: Validate P1 Analytics functional wiring
        run: uv run python scripts/check_p1_analytics_functional_wiring.py

      - name: Stage 0B deterministic Analysis Bundle fixture
        run: |
          uv run python scripts/build_stage0b_fixture.py
          uv run tennisai bundle validate --bundle .artifacts/stage0b-analysis-bundle-fixture/bundle --json
          test "$(jq -r '.fingerprints_identical' .artifacts/stage0b-analysis-bundle-fixture/build-report.json)" = "true"
          uv run pytest tests/test_analysis_bundle_*.py tests/test_product_*.py

      - name: Stage 1A deterministic single-rally import fixture
        run: |
          uv run python scripts/build_stage1a_fixture.py
          uv run tennisai rally validate --bundle .artifacts/stage1a-single-rally-import/bundle --json
          test "$(jq -r '.fingerprints_identical' .artifacts/stage1a-single-rally-import/import-report.json)" = "true"
          uv run pytest tests/test_single_rally.py

      - name: Ruff
        run: uv run ruff check .

      - name: Compile Python sources
        run: uv run python -m compileall src scripts tests infrastructure

      - name: Replit smoke test
        run: uv run python scripts/replit_smoke_test.py

      - name: Validate serialized Analytics schemas
        run: uv run --with "jsonschema>=4.23,<5" python -m src.analytics.schema_validation

      - name: Publish Stage 0B Analysis Bundle fixture
        uses: actions/upload-artifact@v4
        with:
          name: stage0b-analysis-bundle-fixture
          path: |
            .artifacts/stage0b-analysis-bundle-fixture/manifest.json
            .artifacts/stage0b-analysis-bundle-fixture/session.json
            .artifacts/stage0b-analysis-bundle-fixture/rallies.json
            .artifacts/stage0b-analysis-bundle-fixture/build-report.json
            .artifacts/stage0b-analysis-bundle-fixture/validation-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish Stage 1A single-rally import fixture
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-single-rally-import
          path: |
            .artifacts/stage1a-single-rally-import/manifest.json
            .artifacts/stage1a-single-rally-import/session.json
            .artifacts/stage1a-single-rally-import/rallies.json
            .artifacts/stage1a-single-rally-import/events.jsonl
            .artifacts/stage1a-single-rally-import/ball_track.jsonl
            .artifacts/stage1a-single-rally-import/court_map.json
            .artifacts/stage1a-single-rally-import/metrics.json
            .artifacts/stage1a-single-rally-import/import-report.json
            .artifacts/stage1a-single-rally-import/validation-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish P1 GPU retest visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: p1-gpu-retest-visual-evidence
          path: |
            docs/validation/assets/p1_gpu_retest_contact_sheet.jpg
            docs/validation/assets/p1_gpu_retest_before_after.jpg
            docs/validation/P1_GPU_RETEST_VISUAL_AUDIT.md
            config/player_perception/p1_gpu_retest_result.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
