      - name: Publish Stage 5B v3.3 event-constrained evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5b-v33-event-constrained-evidence
          path: |
            docs/validation/assets/stage5b_v33_event_timeline.jpg
            docs/validation/assets/stage5b_v33_segment_endpoint_audit.jpg
            docs/validation/assets/stage5b_v33_contact_volume_audit.jpg
            docs/validation/assets/stage5b_v33_worst_reprojection_frames.jpg
            docs/validation/assets/stage5b_v33_top_view.jpg
            docs/validation/assets/stage5b_v33_side_view.jpg
            docs/validation/assets/stage5b_v33_hypothesis_geometry.jpg
            docs/validation/assets/stage5b_v33_objective_breakdown.jpg
            docs/validation/STAGE5B_V33_VISUAL_AUDIT.md
            config/stage5b_v3/stage5b_v33_result.json
            config/stage5b_v3/stage5b_v33_event_timeline.json
            config/stage5b_v3/stage5b_v33_segment_topology.json
            config/stage5b_v3/stage5b_v32_contact_residual_forensics.json
            config/stage5b_v3/stage5b_v33_endpoint_feasibility.json
