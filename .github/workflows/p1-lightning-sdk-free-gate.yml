name: P1 Lightning SDK free gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/player-perception-p1-provider-pivot

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Lightning SDK
        run: python -m pip install --disable-pip-version-check -r infrastructure/lightning/requirements-lightning.txt

      - name: Install uv for project tests
        run: python -m pip install --disable-pip-version-check uv

      - name: Print SDK and CLI versions
        run: |
          python -c 'import importlib.metadata; print("lightning-sdk", importlib.metadata.version("lightning-sdk"))'
          lightning --version

      - name: Run Lightning gate tests
        run: uv run --extra dev pytest tests/test_lightning_provider_gate.py

      - name: Validate SDK API shape offline
        run: python scripts/lightning_sdk_gate.py > "$RUNNER_TEMP/lightning-sdk-report.json"

      - name: Store SDK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-lightning-sdk-report
          path: ${{ runner.temp }}/lightning-sdk-report.json
          retention-days: 3
