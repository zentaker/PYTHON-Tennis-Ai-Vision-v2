name: P1 Modal SDK free gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/player-perception-p1-modal-sdk-gate

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Modal SDK
        run: python -m pip install --disable-pip-version-check -r infrastructure/modal/requirements-modal.txt

      - name: Install uv for project tests
        run: python -m pip install --disable-pip-version-check uv

      - name: Print SDK and CLI versions
        run: |
          python -c 'import importlib.metadata; print("modal", importlib.metadata.version("modal"))'
          modal --version

      - name: Run adapter tests
        run: uv run pytest tests/test_modal_adapter.py

      - name: Run guarded dry-run
        run: uv run python -m infrastructure.modal.p1_smoke --dry-run

      - name: Validate SDK API shape offline
        run: python scripts/modal_sdk_gate.py

      - name: Upload small SDK report
        if: always()
        run: |
          python scripts/modal_sdk_gate.py > "$RUNNER_TEMP/modal-sdk-report.json"
        # The report is uploaded only as a small local artifact; no Modal resource is used.
      - name: Store SDK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-modal-sdk-report
          path: ${{ runner.temp }}/modal-sdk-report.json
          retention-days: 3
