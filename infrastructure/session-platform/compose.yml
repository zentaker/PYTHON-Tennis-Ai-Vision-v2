services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tennisai}
      POSTGRES_USER: ${POSTGRES_USER:-tennisai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tennisai-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - session-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin-local-only}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - session-platform-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin-local-only}
      S3_BUCKET: ${S3_BUCKET:-tennisai-local}
      MINIO_CORS_MAX_AGE: ${MINIO_CORS_MAX_AGE:-3600}
    volumes:
      - ./minio/cors.xml:/config/cors.xml:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "set -ex
      && until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done
      && mc mb --ignore-existing local/$${S3_BUCKET:-tennisai-local}
      && mc cors set local/$${S3_BUCKET:-tennisai-local} /config/cors.xml
      && (mc cors info local/$${S3_BUCKET:-tennisai-local} || mc cors get local/$${S3_BUCKET:-tennisai-local})
      && mc anonymous get local/$${S3_BUCKET:-tennisai-local}"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/session-platform/Dockerfile
    environment:
      TENNISAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tennisai}:${POSTGRES_PASSWORD:-tennisai-local-only}@postgres:5432/${POSTGRES_DB:-tennisai}
      TENNISAI_S3_INTERNAL_ENDPOINT_URL: http://minio:9000
      TENNISAI_S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
      TENNISAI_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      TENNISAI_S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin-local-only}
      TENNISAI_S3_BUCKET: ${S3_BUCKET:-tennisai-local}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["/app/infrastructure/session-platform/start-api.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  session-platform-postgres:
  session-platform-minio:
