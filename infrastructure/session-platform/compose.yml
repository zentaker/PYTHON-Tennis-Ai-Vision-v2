services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tennisai}
      POSTGRES_USER: ${POSTGRES_USER:-tennisai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tennisai-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - session-platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin-local-only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - session-platform-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${S3_BUCKET:-tennisai-local}"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/session-platform/Dockerfile
    environment:
      TENNISAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tennisai}:${POSTGRES_PASSWORD:-tennisai-local-only}@postgres:5432/${POSTGRES_DB:-tennisai}
      TENNISAI_S3_ENDPOINT_URL: http://minio:9000
      TENNISAI_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      TENNISAI_S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin-local-only}
      TENNISAI_S3_BUCKET: ${S3_BUCKET:-tennisai-local}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["uv", "run", "--extra", "platform", "tennisai", "platform", "api", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  session-platform-postgres:
  session-platform-minio:
