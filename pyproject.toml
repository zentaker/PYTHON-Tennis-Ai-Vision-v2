[project]
name = "tennis-vision-ai-v2"
version = "0.1.0"
description = "TennisAI Session Analyzer Core and deterministic Analysis Bundle producer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python>=4.10",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
tracker = [
    "torch>=2.0,<3.0",
    "torchvision>=0.15",
    "hydra-core>=1.3",
    "scikit-learn>=1.1",
    "scikit-image>=0.19",
    "pandas>=1.5",
    "einops>=0.4",
    "timm>=0.6",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "ipykernel>=6.29",
]

[project.scripts]
tennisai = "src.product.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
