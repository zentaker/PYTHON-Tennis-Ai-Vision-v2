<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tennis Vision AI - Manual Event Annotator</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #101418; color: #e8edf2; }
    header, main { max-width: 1180px; margin: auto; padding: 18px; }
    header { border-bottom: 1px solid #34404b; }
    h1, h2 { margin: 0 0 12px; }
    .notice { color: #ffc66d; }
    .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; }
    .panel { background: #182028; border: 1px solid #34404b; border-radius: 10px; padding: 16px; }
    video { width: 100%; max-height: 560px; background: #000; }
    label { display: grid; gap: 5px; font-size: 13px; color: #bec8d2; }
    input, select, textarea, button {
      box-sizing: border-box; width: 100%; padding: 9px; color: #eef4f8;
      background: #222d37; border: 1px solid #485867; border-radius: 6px;
    }
    button { cursor: pointer; font-weight: 650; }
    button:hover { background: #2d3b47; }
    .danger { color: #ffb7b7; border-color: #8e4646; }
    .primary { background: #176a54; border-color: #2da982; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .position { font: 700 16px ui-monospace, monospace; color: #8ed5ff; margin: 8px 0; }
    form { display: grid; gap: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #34404b; padding: 8px 6px; text-align: left; }
    td button { width: auto; padding: 5px 8px; margin-right: 4px; }
    #message { min-height: 22px; white-space: pre-wrap; color: #ffb7b7; }
    .footer-actions { display: flex; gap: 10px; margin-top: 14px; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Stage 4 · Anotador manual de eventos</h1>
    <div class="notice">La herramienta registra decisiones humanas; no detecta ni inventa eventos.</div>
  </header>
  <main>
    <div class="grid">
      <section class="panel">
        <h2>Video local</h2>
        <div class="row">
          <label>Archivo de video
            <input id="videoFile" type="file" accept="video/*">
          </label>
          <label>FPS
            <input id="fps" type="number" min="0.001" step="0.001" value="60">
          </label>
        </div>
        <label>Ruta que se guardará en el JSON
          <input id="clipPath" value="data/reference_clip/madrid_R1.mov">
        </label>
        <video id="video" controls preload="metadata"></video>
        <div id="position" class="position">frame 0 · 0.000 s</div>
        <div class="controls">
          <button id="previousFrame" type="button">← frame</button>
          <button id="playPause" type="button">Play / pausa</button>
          <button id="nextFrame" type="button">frame →</button>
        </div>
        <p>Atajos: ←/→ avanza un frame; espacio reproduce o pausa.</p>
      </section>

      <section class="panel">
        <h2>Evento</h2>
        <form id="eventForm">
          <div class="row">
            <label>ID
              <input id="eventId" required>
            </label>
            <label>Tipo
              <select id="eventType">
                <option>serve</option><option>hit</option><option>bounce</option><option>unknown</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>Frame inicio
              <input id="frameStart" type="number" min="0" step="1" required>
              <button id="useStart" type="button">Usar frame actual</button>
            </label>
            <label>Frame fin
              <input id="frameEnd" type="number" min="0" step="1" required>
              <button id="useEnd" type="button">Usar frame actual</button>
            </label>
          </div>
          <div class="row">
            <label>Player
              <select id="player"><option>near</option><option>far</option><option>unknown</option></select>
            </label>
            <label>Side
              <select id="side"><option>near</option><option>far</option><option>unknown</option></select>
            </label>
          </div>
          <label>Shot type
            <select id="shotType">
              <option>saque</option><option>derecha</option><option>revés</option>
              <option>derecha_invertida</option><option>revés_invertido</option>
              <option>slice</option><option>volea</option><option>dejada</option>
              <option>globo</option><option>unknown</option>
            </select>
          </label>
          <label>Court zone
            <select id="courtZone">
              <option>zona_saque_derecha</option><option>zona_saque_izquierda</option>
              <option>fondo</option><option>media</option><option>aprox_red</option>
              <option>red</option><option>unknown</option>
            </select>
          </label>
          <label>Notas
            <textarea id="notes" rows="3"></textarea>
          </label>
          <div class="row">
            <button class="primary" type="submit">Guardar evento</button>
            <button id="cancelEdit" type="button">Cancelar edición</button>
          </div>
        </form>
        <div id="message"></div>
      </section>
    </div>

    <section class="panel" style="margin-top: 18px">
      <h2>Eventos registrados</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Tipo</th><th>Frames</th><th>Segundos</th><th>Player/side</th><th>Golpe/zona</th><th>Acciones</th></tr>
        </thead>
        <tbody id="eventRows"></tbody>
      </table>
      <div class="footer-actions">
        <button id="exportJson" class="primary" type="button">Exportar manual_annotation.json</button>
        <button id="clearEvents" class="danger" type="button">Eliminar todos</button>
      </div>
    </section>
  </main>

  <script>
    "use strict";
    const video = document.getElementById("video");
    const fpsInput = document.getElementById("fps");
    const message = document.getElementById("message");
    const events = [];
    let editingId = null;
    let videoUrl = null;

    const field = (id) => document.getElementById(id);
    const fps = () => {
      const value = Number(fpsInput.value);
      if (!Number.isFinite(value) || value <= 0) throw new Error("FPS debe ser mayor que cero.");
      return value;
    };
    const currentFrame = () => Math.max(0, Math.round(video.currentTime * fps()));
    const totalFrames = () => Number.isFinite(video.duration) ? Math.round(video.duration * fps()) : 0;

    function updatePosition() {
      try {
        field("position").textContent = `frame ${currentFrame()} · ${video.currentTime.toFixed(3)} s`;
      } catch (error) {
        field("position").textContent = error.message;
      }
    }

    function seekFrames(delta) {
      video.pause();
      const target = Math.max(0, currentFrame() + delta);
      const maxTime = Number.isFinite(video.duration) ? video.duration : target / fps();
      video.currentTime = Math.min(target / fps(), maxTime);
      updatePosition();
    }

    function nextId() {
      let number = events.length + 1;
      let candidate = "";
      do {
        candidate = `ev_${String(number).padStart(3, "0")}`;
        number += 1;
      } while (events.some((event) => event.id === candidate));
      return candidate;
    }

    function resetForm() {
      editingId = null;
      field("eventId").value = nextId();
      field("eventType").value = "hit";
      field("frameStart").value = currentFrame();
      field("frameEnd").value = currentFrame();
      field("player").value = "unknown";
      field("side").value = "unknown";
      field("shotType").value = "unknown";
      field("courtZone").value = "unknown";
      field("notes").value = "";
      message.textContent = "";
    }

    function eventFromForm() {
      const start = Number(field("frameStart").value);
      const end = Number(field("frameEnd").value);
      const id = field("eventId").value.trim();
      if (!id) throw new Error("El evento necesita un ID.");
      if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end < start) {
        throw new Error("Los frames deben ser enteros y cumplir 0 ≤ inicio ≤ fin.");
      }
      const limit = totalFrames();
      if (limit && end >= limit) throw new Error(`Frame fin fuera del video (${limit} frames).`);
      if (events.some((event) => event.id === id && event.id !== editingId)) {
        throw new Error(`ID duplicado: ${id}`);
      }
      return {
        id,
        type: field("eventType").value,
        frame_range: [start, end],
        player: field("player").value,
        side: field("side").value,
        shot_type: field("shotType").value,
        court_zone: field("courtZone").value,
        source: "manual_annotation",
        notes: field("notes").value,
      };
    }

    function renderEvents() {
      events.sort((a, b) => a.frame_range[0] - b.frame_range[0] || a.frame_range[1] - b.frame_range[1]);
      const rows = field("eventRows");
      rows.replaceChildren();
      for (const event of events) {
        const row = document.createElement("tr");
        const startSeconds = (event.frame_range[0] / fps()).toFixed(3);
        const endSeconds = (event.frame_range[1] / fps()).toFixed(3);
        const cells = [
          event.id,
          event.type,
          `${event.frame_range[0]}–${event.frame_range[1]}`,
          `${startSeconds}–${endSeconds}`,
          `${event.player}/${event.side}`,
          `${event.shot_type}/${event.court_zone}`,
        ];
        for (const value of cells) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        }
        const actions = document.createElement("td");
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "Editar";
        edit.addEventListener("click", () => editEvent(event.id));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Eliminar";
        remove.className = "danger";
        remove.addEventListener("click", () => deleteEvent(event.id));
        actions.append(edit, remove);
        row.appendChild(actions);
        rows.appendChild(row);
      }
    }

    function editEvent(id) {
      const event = events.find((item) => item.id === id);
      if (!event) return;
      editingId = id;
      field("eventId").value = event.id;
      field("eventType").value = event.type;
      field("frameStart").value = event.frame_range[0];
      field("frameEnd").value = event.frame_range[1];
      field("player").value = event.player;
      field("side").value = event.side;
      field("shotType").value = event.shot_type;
      field("courtZone").value = event.court_zone;
      field("notes").value = event.notes;
      message.textContent = `Editando ${id}`;
    }

    function deleteEvent(id) {
      const index = events.findIndex((event) => event.id === id);
      if (index >= 0) events.splice(index, 1);
      if (editingId === id) resetForm();
      renderEvents();
    }

    field("videoFile").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (videoUrl) URL.revokeObjectURL(videoUrl);
      videoUrl = URL.createObjectURL(file);
      video.src = videoUrl;
      field("clipPath").value = `data/reference_clip/${file.name}`;
    });
    video.addEventListener("timeupdate", updatePosition);
    video.addEventListener("loadedmetadata", () => { updatePosition(); resetForm(); });
    fpsInput.addEventListener("change", () => { updatePosition(); renderEvents(); });
    field("previousFrame").addEventListener("click", () => seekFrames(-1));
    field("nextFrame").addEventListener("click", () => seekFrames(1));
    field("playPause").addEventListener("click", () => video.paused ? video.play() : video.pause());
    field("useStart").addEventListener("click", () => { field("frameStart").value = currentFrame(); });
    field("useEnd").addEventListener("click", () => { field("frameEnd").value = currentFrame(); });
    field("cancelEdit").addEventListener("click", resetForm);

    document.addEventListener("keydown", (event) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (event.key === "ArrowLeft") { event.preventDefault(); seekFrames(-1); }
      if (event.key === "ArrowRight") { event.preventDefault(); seekFrames(1); }
      if (event.code === "Space") {
        event.preventDefault();
        video.paused ? video.play() : video.pause();
      }
    });

    field("eventForm").addEventListener("submit", (submitEvent) => {
      submitEvent.preventDefault();
      try {
        const event = eventFromForm();
        if (editingId) {
          const index = events.findIndex((item) => item.id === editingId);
          events[index] = event;
        } else {
          events.push(event);
        }
        renderEvents();
        resetForm();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    field("clearEvents").addEventListener("click", () => {
      if (events.length && confirm("¿Eliminar todos los eventos anotados?")) {
        events.splice(0, events.length);
        renderEvents();
        resetForm();
      }
    });

    field("exportJson").addEventListener("click", () => {
      try {
        if (!events.length) throw new Error("No se puede exportar sin eventos humanos.");
        if (!video.src || !totalFrames()) throw new Error("Cargá el video antes de exportar.");
        if (!field("clipPath").value.trim()) throw new Error("La ruta del clip es obligatoria.");
        const payload = {
          clip_path: field("clipPath").value.trim(),
          level: "A",
          fps: fps(),
          duration_seconds: Number.isFinite(video.duration) ? video.duration : 0,
          frames_total: totalFrames(),
          court_corners_pixel: {},
          service_box_corners_pixel: {},
          players: { near: { label: "near" }, far: { label: "far" } },
          narrative_events: events,
          ball_manual_positions: [],
          notes: "Eventos creados y revisados manualmente con manual_event_annotator.",
        };
        const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "manual_annotation.json";
        link.click();
        URL.revokeObjectURL(url);
        message.textContent = "manual_annotation.json exportado.";
      } catch (error) {
        message.textContent = error.message;
      }
    });

    resetForm();
    updatePosition();
  </script>
</body>
</html>
